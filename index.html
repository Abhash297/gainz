<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GainZ</title>
<meta name="theme-color" content="#1f6feb" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/style.css" />
<script>
  // Applied before first paint so there's no flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem('gainz-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>

<header class="topbar">
  <h1>GainZ</h1>
  <div class="header-actions">
    <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">🌙</button>
    <button class="icon-btn" id="settings-btn" aria-label="Settings">&#9881;</button>
  </div>
</header>

<div class="mode-switch" id="mode-switch">
  <button class="mode-btn" data-mode="lifting">Lifting</button>
  <button class="mode-btn" data-mode="nutrition">Nutrition</button>
</div>

<main id="view-root"></main>

<nav class="tabbar" id="tabbar"></nav>

<script src="vendor/chart.umd.js"></script>
<script src="js/db.js"></script>
<script src="js/stats.js"></script>
<script src="js/nutrition-stats.js"></script>
<script src="js/foods-data.js"></script>
<script src="js/ai-estimate.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
