<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GainZ</title>
<meta name="theme-color" content="#1f6feb" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/style.css" />
<script>
  // Applied before first paint so there's no flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem('gainz-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M3 12h18M6 8v8M18 8v8"></path></svg></div>
    <h1>GainZ</h1>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"></button>
    <button class="icon-btn" id="settings-btn" aria-label="Settings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path></svg></button>
  </div>
</header>

<div class="mode-switch" id="mode-switch">
  <div class="mode-switch-thumb" id="mode-thumb"></div>
  <button class="mode-btn" data-mode="lifting">Lifting</button>
  <button class="mode-btn" data-mode="nutrition">Nutrition</button>
</div>

<main id="view-root"></main>

<nav class="tabbar" id="tabbar"></nav>

<script src="vendor/chart.umd.js"></script>
<script src="js/db.js"></script>
<script src="js/stats.js"></script>
<script src="js/nutrition-stats.js"></script>
<script src="js/foods-data.js"></script>
<script src="js/ai-estimate.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
